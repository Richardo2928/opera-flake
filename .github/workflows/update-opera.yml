name: Update Opera flake

on:
  schedule:
    - cron: "0 8 * * 1,3,5" # every Monday, Wednesday, Friday at 8:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if update is needed
        id: check
        run: |
          chmod +x scripts/check-opera-update.sh
          scripts/check-opera-update.sh

      - name: Run updater
        if: steps.check.outputs.update_needed == 'true'
        run: |
          chmod +x update.sh
          ./update.sh

      - name: Commit
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore: update Opera (stable ${{ steps.check.outputs.stable_latest }}, gx ${{ steps.check.outputs.gx_latest }})"
            git push
          else
            echo "No changes after update.sh"
          fi